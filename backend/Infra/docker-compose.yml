services:
  users-auth-db:
    image: postgres:16
    container_name: lms-users-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - users_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  users_auth_data:
